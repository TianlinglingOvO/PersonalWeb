<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 彩色立体萌粉蝴蝶结 (Twemoji / 扁平高规格) -->
    <g id="pastel-bow">
      <!-- 左右侧软翼 -->
      <path d="M 0,0 C -6,-10 -16,-8 -16,-1 C -16,6 -7,8 0,1 Z" fill="#ff758f" />
      <path d="M 0,0 C 6,-10 16,-8 16,-1 C 16,6 7,8 0,1 Z" fill="#ff758f" />
      <!-- 下垂缎带 -->
      <path d="M -2,2 C -5,7 -8,11 -12,14 L -8,14 C -5,11 -3,7 -1,2 Z" fill="#ff4d6d" />
      <path d="M 2,2 C 5,7 8,11 12,14 L 8,14 C 5,11 3,7 1,2 Z" fill="#ff4d6d" />
      <!-- 蝴蝶结心 -->
      <ellipse cx="0" cy="0" rx="3" ry="2.6" fill="#ffb3c1" stroke="#ff4d6d" stroke-width="0.8" />
    </g>

    <!-- 萌粉双心 (Double Hearts) -->
    <g id="pastel-heart">
      <!-- 主心 -->
      <path d="M 0,3 C -2,-3 -9,-3 -9,3 C -9,7.5 -3,11 0,14 C 3,11 9,7.5 9,3 C 9,-3 2,-3 0,3 Z" fill="#ff758f" />
      <!-- 次心微浮 -->
      <path d="M 6,-4 C 5,-7 1,-7 1,-4 C 1,-1.5 4,0.5 6,2.5 C 8,0.5 11,-1.5 11,-4 C 11,-7 7,-7 6,-4 Z" fill="#ffb3c1" />
    </g>

    <!-- 国际标准经典萌系小草莓 (Official Twemoji 1F353 经典矢量) -->
    <g id="pastel-berry">
      <g transform="translate(-12, -12) scale(0.68)">
        <!-- 饱满草莓果肉 -->
        <path fill="#ff4d6d" d="M22.614 34.845c3.462-1.154 6.117-3.034 6.12-9.373C28.736 21.461 33 17 32.999 12.921 32.998 9 28.384 2.537 17.899 3.635 7.122 4.764 3 8 2.999 15.073c0 4.927 5.304 8.381 8.127 13.518C13 32 18.551 38.187 22.614 34.845z"/>
        <!-- 翠绿叶冠 (自然覆盖在草莓顶部，绝无突兀黑杆) -->
        <path fill="#52b788" d="M26.252 3.572c-1.278-1.044-3.28-1.55-5.35-1.677.273-.037.542-.076.82-.094.973-.063 3.614-1.232 1.4-1.087-.969.063-1.901.259-2.837.423.237-.154.479-.306.74-.442C21 0 17 0 14.981 1.688 14.469 1.576 14 1 11 1c-2 0-4.685.926-3 1 .917.041 2 0 1.858.365C9.203 2.425 6 3 6 4c0 .353 2.76-.173 3 0-1.722.644-3 2-3 3 0 .423 2.211-.825 3-1-1 1-1.4 1.701-1.342 2.427.038.475 2.388-.09 2.632-.169.822-.27 3.71-1.258 4.6-2.724.117.285 2.963 1.341 4.11 1.466.529.058 2.62.274 2.141-.711C21 6 20 5 19.695 4.025c.446-.019 8.305.975 6.557-.453z"/>
        <!-- 金黄微籽 -->
        <path fill="#ffe066" d="M9.339 17.306c-.136-1.46-2.54-3.252-2.331-1 .136 1.46 2.54 3.252 2.331 1zm7.458.553c-.069-.622-.282-1.191-.687-1.671-.466-.55-1.075-.362-1.234.316-.187.799.082 1.752.606 2.372l.041.048c-.213-.525-.427-1.05-.642-1.574l.006.047c.071.64.397 1.73 1.136 1.906.754.182.826-.988.774-1.444zm5.752-4.841c.476-.955.17-3.962-.831-1.954-.476.954-.171 3.962.831 1.954zm7.211-1.457c-.03-.357-.073-.78-.391-1.01-1.189-.858-2.381 2.359-1.385 3.08.02.012.036.025.055.039l-.331-.919c0 .018.001.035.003.052.049.564.376 1.377 1.084.948.667-.406 1.028-1.444.965-2.19zm-1.345 8.567c1.016-1.569-.545-3.451-1.78-1.542-1.016 1.568.546 3.45 1.78 1.542zm-5.748 2.894c.173-1.938-2.309-2.752-2.51-.496-.173 1.938 2.309 2.752 2.51.496zm-9.896-1.212l-.049.004 1.362.715c-.006-.004-.011-.011-.018-.017-.306-.28-1.353-1.083-1.788-.592-.44.497.498 1.421.804 1.703.342.314.928.763 1.429.73 1.437-.093-.783-2.605-1.74-2.543zm13.227 5.907c.969-1.066.725-4.05-.798-2.376-.969 1.066-.724 4.05.798 2.376zM12.599 13.753c.093-.005.187-.012.28-.019.703-.046 1.004-1.454 1.042-1.952.044-.571-.043-1.456-.785-1.407l-.281.019c-.702.047-1.004 1.454-1.042 1.952-.044.571.044 1.457.786 1.407zm7.846 15.257c.395.764.252 1.623-.32 1.919s-1.357-.081-1.753-.844c-.395-.764-.252-1.623.32-1.919.573-.296 1.357.081 1.753.844z"/>
      </g>
    </g>

    <!-- 治愈系粉白萌猫爪 (Cat Paw) -->
    <g id="pastel-paw">
      <!-- 掌肉垫 -->
      <path d="M -6,2 C -6.5,-1 -4,-3 0,-3 C 4,-3 6.5,-1 6,2 C 5.5,5 3,7 0,7 C -3,7 -5.5,5 -6,2 Z" fill="#ff8fa3" />
      <!-- 4 指肉球 -->
      <circle cx="-6" cy="-5" r="2.1" fill="#ff8fa3" />
      <circle cx="-2" cy="-7.5" r="2.2" fill="#ff8fa3" />
      <circle cx="2" cy="-7.5" r="2.2" fill="#ff8fa3" />
      <circle cx="6" cy="-5" r="2.1" fill="#ff8fa3" />
    </g>

    <!-- 亮晶晶四芒星 (Sparkle Star - 嫩黄微光) -->
    <g id="pastel-star">
      <path d="M 0,-10 Q 0,-0.8 10,0 Q 0,0.8 0,10 Q 0,0.8 -10,0 Q 0,-0.8 0,-10 Z" fill="#ffc300" />
      <circle cx="0" cy="0" r="1.8" fill="#ffffff" />
    </g>

    <!-- 梦幻粉紫弯月 (Lilac Moon) -->
    <path id="pastel-moon" d="M 3,-7 A 7 7 0 1 0 3,7 A 5.5 5.5 0 1 1 3,-7 Z" fill="#9d4edd" />
  </defs>

  <!-- 淡雅贴图层 (整体 0.20 柔和微透，绝对不刺眼、不抢文字焦点) -->
  <g opacity="0.22">
    <!-- 蝴蝶结 -->
    <g transform="translate(100, 100) rotate(-8)">
      <use href="#pastel-bow" />
    </g>

    <!-- 草莓 -->
    <g transform="translate(40, 40) rotate(12)">
      <use href="#pastel-berry" />
    </g>
    <g transform="translate(160, 160) rotate(-15)">
      <use href="#pastel-berry" />
    </g>

    <!-- 双心 -->
    <g transform="translate(160, 40) rotate(-10)">
      <use href="#pastel-heart" />
    </g>
    <g transform="translate(40, 160) rotate(14)">
      <use href="#pastel-heart" />
    </g>

    <!-- 猫爪印 -->
    <g transform="translate(100, 25) rotate(6)">
      <use href="#pastel-paw" />
    </g>
    <g transform="translate(100, 175) rotate(-8)">
      <use href="#pastel-paw" />
    </g>

    <!-- 闪亮星芒 (四个角落平铺缝合) -->
    <use href="#pastel-star" x="0" y="0" />
    <use href="#pastel-star" x="200" y="0" />
    <use href="#pastel-star" x="0" y="200" />
    <use href="#pastel-star" x="200" y="200" />

    <!-- 左右闪亮小星 -->
    <use href="#pastel-star" x="15" y="100" transform="scale(0.7) translate(10, 30)" />
    <use href="#pastel-star" x="185" y="100" transform="scale(0.7) translate(70, 30)" />

    <!-- 弯月 -->
    <g transform="translate(70, 130) rotate(-20)">
      <use href="#pastel-moon" />
    </g>
    <g transform="translate(130, 70) rotate(25)">
      <use href="#pastel-moon" />
    </g>

    <!-- 晶莹淡彩微浮泡泡 -->
    <circle cx="80" cy="65" r="2" fill="#a0c4ff" />
    <circle cx="120" cy="135" r="2.2" fill="#a0c4ff" />
    <circle cx="30" cy="115" r="1.8" fill="#cdb4db" />
    <circle cx="170" cy="85" r="1.8" fill="#cdb4db" />
  </g>
</svg>
