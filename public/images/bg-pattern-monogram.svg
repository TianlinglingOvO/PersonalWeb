<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- 精致对称蝴蝶结 (16x12) -->
    <g id="mono-ribbon">
      <path d="M 0,0 C -3,-5 -9,-4.5 -9,0 C -9,4 -3,4.5 0,0 Z" />
      <path d="M 0,0 C 3,-5 9,-4.5 9,0 C 9,4 3,4.5 0,0 Z" />
      <circle cx="0" cy="0" r="1.5" />
      <path d="M -1.2,1.5 C -3,4.5 -5,7 -7,9 M 1.2,1.5 C 3,4.5 5,7 7,9" />
    </g>

    <!-- 精细四角芒星 (14x14) -->
    <path id="mono-sparkle" d="M 0,-8 Q 0,-0.8 8,0 Q 0,0.8 0,8 Q 0,0.8 -8,0 Q 0,-0.8 0,-8 Z" />

    <!-- 饱满爱心 (12x12) -->
    <path id="mono-heart" d="M 0,2 C -2,-2 -7,-2 -7,2.2 C -7,5.5 -2.5,8.5 0,11 C 2.5,8.5 7,5.5 7,2.2 C 7,-2 2,-2 0,2 Z" />

    <!-- 规整可爱猫爪 (13x13) -->
    <g id="mono-paw">
      <path d="M -4.5,2 C -5,-0.5 -3,-2 0,-2 C 3,-2 5,-0.5 4.5,2 C 4,4.5 2,5.5 0,5.5 C -2,5.5 -4,4.5 -4.5,2 Z" />
      <circle cx="-5" cy="-4.5" r="1.5" />
      <circle cx="-1.8" cy="-6.5" r="1.5" />
      <circle cx="1.8" cy="-6.5" r="1.5" />
      <circle cx="5" cy="-4.5" r="1.5" />
    </g>

    <!-- 典雅五瓣微落樱 (12x12) -->
    <g id="mono-sakura">
      <circle cx="0" cy="0" r="1.2" />
      <path d="M 0,-1.5 C -1.5,-4.5 1.5,-4.5 0,-1.5 Z" />
      <path d="M 1.4,-0.5 C 4.5,-2 4.5,1 1.4,-0.5 Z" />
      <path d="M 0.9,1.2 C 2.8,4.2 0.2,5 0.9,1.2 Z" />
      <path d="M -0.9,1.2 C -0.2,5 -2.8,4.2 -0.9,1.2 Z" />
      <path d="M -1.4,-0.5 C -4.5,1 -4.5,-2 -1.4,-0.5 Z" />
    </g>

    <!-- 纤细微弯月 (10x10) -->
    <path id="mono-moon" d="M 2,-5 A 5.5 5.5 0 1 0 2,5 A 4.2 4.2 0 1 1 2,-5 Z" />
  </defs>

  <!-- 45度斜向菱形连接线 (极细极柔，构筑印花骨架) -->
  <g stroke="#e25c7a" stroke-width="0.7" stroke-dasharray="2, 6" opacity="0.18">
    <line x1="0" y1="0" x2="160" y2="160" />
    <line x1="160" y1="0" x2="0" y2="160" />
    <line x1="80" y1="0" x2="160" y2="80" />
    <line x1="0" y1="80" x2="80" y2="160" />
    <line x1="80" y1="0" x2="0" y2="80" />
    <line x1="160" y1="80" x2="80" y2="160" />
  </g>

  <!-- 主印花元素层 (柔粉与暖珊瑚色调) -->
  <g fill="none" stroke="#e25c7a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.32">
    <!-- 中心枢纽：标准蝴蝶结 -->
    <g transform="translate(80, 80)">
      <use href="#mono-ribbon" fill="#e25c7a" fill-opacity="0.10" />
    </g>

    <!-- 四角顶点：四角星芒 (平铺缝合) -->
    <use href="#mono-sparkle" x="0" y="0" fill="#e25c7a" fill-opacity="0.12" />
    <use href="#mono-sparkle" x="160" y="0" fill="#e25c7a" fill-opacity="0.12" />
    <use href="#mono-sparkle" x="0" y="160" fill="#e25c7a" fill-opacity="0.12" />
    <use href="#mono-sparkle" x="160" y="160" fill="#e25c7a" fill-opacity="0.12" />

    <!-- 水平对称点：饱满爱心 -->
    <g transform="translate(0, 80)">
      <use href="#mono-heart" fill="#e25c7a" fill-opacity="0.12" />
    </g>
    <g transform="translate(160, 80)">
      <use href="#mono-heart" fill="#e25c7a" fill-opacity="0.12" />
    </g>

    <!-- 垂直对称点：猫爪印 -->
    <g transform="translate(80, 0)">
      <use href="#mono-paw" fill="#e25c7a" fill-opacity="0.12" />
    </g>
    <g transform="translate(80, 160)">
      <use href="#mono-paw" fill="#e25c7a" fill-opacity="0.12" />
    </g>

    <!-- 对角次级点：落樱与微弯月 -->
    <g transform="translate(40, 40) rotate(15)">
      <use href="#mono-sakura" fill="#e25c7a" fill-opacity="0.10" />
    </g>
    <g transform="translate(120, 120) rotate(-20)">
      <use href="#mono-sakura" fill="#e25c7a" fill-opacity="0.10" />
    </g>

    <g transform="translate(120, 40) rotate(25)">
      <use href="#mono-moon" fill="#e25c7a" fill-opacity="0.12" />
    </g>
    <g transform="translate(40, 120) rotate(-15)">
      <use href="#mono-moon" fill="#e25c7a" fill-opacity="0.12" />
    </g>
  </g>

  <!-- 辅印花层次：柔蓝微尘圆点 (丰富视觉节奏感) -->
  <g fill="#6b7ecb" opacity="0.38">
    <circle cx="80" cy="40" r="1.5" />
    <circle cx="80" cy="120" r="1.5" />
    <circle cx="40" cy="80" r="1.5" />
    <circle cx="120" cy="80" r="1.5" />
  </g>
</svg>
