<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <!-- 4-point anime kirakira sparkle -->
    <path id="sparkle-lg" d="M0,-15 C0,-3 3,0 15,0 C3,0 0,3 0,15 C0,3 -3,0 -15,0 C-3,0 0,-3 0,-15 Z" />
    <path id="sparkle-sm" d="M0,-8 C0,-2 2,0 8,0 C2,0 0,2 0,8 C0,2 -2,0 -8,0 C-2,0 0,-2 0,-8 Z" />
    
    <!-- Delicate Sakura Petal -->
    <path id="sakura-petal" d="M0,-10 C5,-7 8,-1 7,5 C6,10 1.5,12 0,11.5 C-1.5,12 -6,10 -7,5 C-8,-1 -5,-7 0,-10 Z" />
    
    <!-- Twinkle Cross -->
    <path id="twinkle-cross" d="M-5,0 L5,0 M0,-5 L0,5" />
    
    <!-- Mini Crescent Moon -->
    <path id="mini-moon" d="M3,-7 A7,7 0 1,0 3,7 A5.5,5.5 0 1,1 3,-7 Z" />

    <!-- Cute Mini Ribbon Bow -->
    <path id="mini-bow" d="M0,0 L-6,-4 L-6,4 Z M0,0 L6,-4 L6,4 Z" />
  </defs>

  <!-- Sakura Pink Motifs (Airy & Gentle) -->
  <g fill="none" stroke="#e2738f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.32">
    <!-- Big sparkles -->
    <use href="#sparkle-lg" x="68" y="52" />
    <use href="#sparkle-lg" x="308" y="196" />
    <use href="#sparkle-lg" x="148" y="372" />
    
    <!-- Sakura Petals (with gentle rotation) -->
    <g transform="translate(196, 76) rotate(24)">
      <use href="#sakura-petal" fill="#e2738f" fill-opacity="0.08" />
    </g>
    <g transform="translate(416, 120) rotate(-35)">
      <use href="#sakura-petal" fill="#e2738f" fill-opacity="0.08" />
    </g>
    <g transform="translate(72, 268) rotate(42)">
      <use href="#sakura-petal" fill="#e2738f" fill-opacity="0.08" />
    </g>
    <g transform="translate(388, 388) rotate(-18)">
      <use href="#sakura-petal" fill="#e2738f" fill-opacity="0.08" />
    </g>

    <!-- Mini Bow -->
    <use href="#mini-bow" x="240" y="440" />

    <!-- Soft Dots -->
    <circle cx="120" cy="180" r="1.8" fill="#e2738f" />
    <circle cx="360" cy="60" r="1.6" fill="#e2738f" />
    <circle cx="260" cy="272" r="2" fill="#e2738f" />
    <circle cx="44" cy="420" r="1.6" fill="#e2738f" />
  </g>

  <!-- Lavender / Periwinkle Motifs (Complementary Magic Accents) -->
  <g fill="none" stroke="#7984cd" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.26">
    <!-- Medium & Small Sparkles -->
    <use href="#sparkle-sm" x="392" y="260" />
    <use href="#sparkle-sm" x="168" y="148" />
    <use href="#sparkle-sm" x="340" y="440" />

    <!-- Twinkle Crosses -->
    <use href="#twinkle-cross" x="256" y="36" />
    <use href="#twinkle-cross" x="48" y="136" />
    <use href="#twinkle-cross" x="444" y="316" />
    <use href="#twinkle-cross" x="232" y="340" />

    <!-- Crescent Moon -->
    <g transform="translate(320, 96) rotate(-15)">
      <use href="#mini-moon" fill="#7984cd" fill-opacity="0.06" />
    </g>

    <!-- Soft Pastel Dots -->
    <circle cx="204" cy="228" r="1.8" fill="#7984cd" />
    <circle cx="436" cy="44" r="1.5" fill="#7984cd" />
    <circle cx="28" cy="336" r="1.8" fill="#7984cd" />
    <circle cx="452" cy="216" r="1.5" fill="#7984cd" />
  </g>
</svg>
