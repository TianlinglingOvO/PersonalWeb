<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <!-- 软萌猫爪 (Cat Paw) -->
    <g id="cat-paw">
      <ellipse cx="0" cy="3" rx="5.2" ry="4.2" />
      <circle cx="-5.2" cy="-2.5" r="1.8" />
      <circle cx="-1.8" cy="-5" r="1.9" />
      <circle cx="1.8" cy="-5" r="1.9" />
      <circle cx="5.2" cy="-2.5" r="1.8" />
    </g>

    <!-- 少女蝴蝶结 (Ribbon Bow) -->
    <g id="ribbon-bow">
      <!-- 左右翅膀 -->
      <path d="M0,-0.5 C-3,-5 -10,-4 -10,0 C-10,4 -3,3 0,-0.5 Z" />
      <path d="M0,-0.5 C3,-5 10,-4 10,0 C10,4 3,3 0,-0.5 Z" />
      <!-- 中心结 -->
      <circle cx="0" cy="-0.5" r="1.8" />
      <!-- 飘带 -->
      <path d="M-1,1.2 C-3,4 -6,6 -8,8 M1,1.2 C3,4 6,6 8,8" />
    </g>

    <!-- 日系キラキラ大闪光 (Large Sparkle) -->
    <path id="sparkle-lg" d="M0,-15 C0,-3 3,0 15,0 C3,0 0,3 0,15 C0,3 -3,0 -15,0 C-3,0 0,-3 0,-15 Z" />

    <!-- 日系キラキラ小闪光 (Small Sparkle) -->
    <path id="sparkle-sm" d="M0,-8 C0,-2 2,0 8,0 C2,0 0,2 0,8 C0,2 -2,0 -8,0 C-2,0 0,-2 0,-8 Z" />

    <!-- 飘散樱花瓣 (Sakura Petal) -->
    <path id="sakura-petal" d="M0,-10 C5,-7 8,-1 7,5 C6,10 1.5,12 0,11.5 C-1.5,12 -6,10 -7,5 C-8,-1 -5,-7 0,-10 Z" />

    <!-- 软萌饱满心 (Cute Heart) -->
    <path id="cute-heart" d="M0,2.5 C-1.5,-1.5 -6.5,-1.5 -6.5,2.5 C-6.5,7 0,10.5 0,10.5 C0,10.5 6.5,7 6.5,2.5 C6.5,-1.5 1.5,-1.5 0,2.5 Z" />

    <!-- 细微星尘十字 (Twinkle Cross) -->
    <path id="twinkle-cross" d="M-4.5,0 L4.5,0 M0,-4.5 L0,4.5" />

    <!-- 梦幻微弯月 (Mini Crescent Moon) -->
    <path id="mini-moon" d="M2.5,-6.5 A6.5,6.5 0 1,0 2.5,6.5 A5,5 0 1,1 2.5,-6.5 Z" />
  </defs>

  <!-- 粉红少女调微元素 (Soft Strawberry Pink) -->
  <g fill="none" stroke="#f28da4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.30">
    <!-- 猫爪印 -->
    <g transform="translate(80, 70) rotate(-12)">
      <use href="#cat-paw" fill="#f28da4" fill-opacity="0.10" />
    </g>
    <g transform="translate(360, 310) rotate(18)">
      <use href="#cat-paw" fill="#f28da4" fill-opacity="0.10" />
    </g>

    <!-- 蝴蝶结 -->
    <g transform="translate(270, 80) rotate(8)">
      <use href="#ribbon-bow" fill="#f28da4" fill-opacity="0.08" />
    </g>
    <g transform="translate(130, 440) rotate(-15)">
      <use href="#ribbon-bow" fill="#f28da4" fill-opacity="0.08" />
    </g>

    <!-- 大星芒 -->
    <use href="#sparkle-lg" x="430" y="70" />
    <use href="#sparkle-lg" x="220" y="260" />
    <use href="#sparkle-lg" x="460" y="450" />

    <!-- 樱花瓣 -->
    <g transform="translate(180, 160) rotate(32)">
      <use href="#sakura-petal" fill="#f28da4" fill-opacity="0.09" />
    </g>
    <g transform="translate(450, 200) rotate(-28)">
      <use href="#sakura-petal" fill="#f28da4" fill-opacity="0.09" />
    </g>
    <g transform="translate(60, 330) rotate(45)">
      <use href="#sakura-petal" fill="#f28da4" fill-opacity="0.09" />
    </g>

    <!-- 萌萌小爱心 -->
    <g transform="translate(330, 190) scale(0.9)">
      <use href="#cute-heart" fill="#f28da4" fill-opacity="0.10" />
    </g>
    <g transform="translate(250, 470) scale(0.85)">
      <use href="#cute-heart" fill="#f28da4" fill-opacity="0.10" />
    </g>

    <!-- 微星点 -->
    <circle cx="130" cy="270" r="1.8" fill="#f28da4" />
    <circle cx="490" cy="130" r="1.6" fill="#f28da4" />
    <circle cx="390" cy="410" r="1.7" fill="#f28da4" />
  </g>

  <!-- 薰衣草仙女紫微调 (Fairy Lilac / Periwinkle) -->
  <g fill="none" stroke="#8c99e6" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.26">
    <!-- 仙女紫猫爪 -->
    <g transform="translate(210, 380) rotate(-22)">
      <use href="#cat-paw" fill="#8c99e6" fill-opacity="0.09" />
    </g>

    <!-- 小闪光 -->
    <use href="#sparkle-sm" x="140" y="90" />
    <use href="#sparkle-sm" x="320" y="440" />
    <use href="#sparkle-sm" x="50" y="210" />
    <use href="#sparkle-sm" x="480" y="320" />

    <!-- 星尘十字 -->
    <use href="#twinkle-cross" x="380" y="120" />
    <use href="#twinkle-cross" x="280" y="200" />
    <use href="#twinkle-cross" x="170" y="490" />
    <use href="#twinkle-cross" x="80" y="460" />

    <!-- 弯月 -->
    <g transform="translate(240, 130) rotate(-18)">
      <use href="#mini-moon" fill="#8c99e6" fill-opacity="0.08" />
    </g>
    <g transform="translate(420, 240) rotate(14)">
      <use href="#mini-moon" fill="#8c99e6" fill-opacity="0.08" />
    </g>

    <!-- 紫色樱花瓣 -->
    <g transform="translate(300, 350) rotate(-40)">
      <use href="#sakura-petal" fill="#8c99e6" fill-opacity="0.08" />
    </g>

    <!-- 微点 -->
    <circle cx="50" cy="130" r="1.6" fill="#8c99e6" />
    <circle cx="200" cy="40" r="1.5" fill="#8c99e6" />
    <circle cx="340" cy="270" r="1.6" fill="#8c99e6" />
    <circle cx="430" cy="380" r="1.5" fill="#8c99e6" />
  </g>
</svg>
